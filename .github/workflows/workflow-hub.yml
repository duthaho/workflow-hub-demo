name: Workflow Hub

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: workflow-hub-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm install --global https://github.com/duthaho/workflow-hub/releases/download/v0.1.0/duthaho-workflow-hub-0.1.0.tgz
      - run: workflow-hub verify
      - run: workflow-hub doctor --ci
